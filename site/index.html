<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>算法导论 · 闯关式学习站</title>
    <meta
      name="description"
      content="把 CLRS《算法导论》第 4 版拆成 149 个可交互关卡的闯关式学习站：原文逐字对照、动画可单步、伪代码与 C 双轨。"
    />
    <!-- 设计令牌 + 版式 + 组件（运行时 Agent 拥有） -->
    <link rel="stylesheet" href="./assets/theme.css" />
    <link rel="stylesheet" href="./assets/layout.css" />
    <link rel="stylesheet" href="./assets/components.css" />
    <link rel="stylesheet" href="./assets/ui/level.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a class="brand" href="#/">算法导论 · 闯关式学习站</a>
        <span class="spacer"></span>
        <span class="header-progress" id="header-progress" aria-live="polite"></span>
        <nav class="app-header__tools" aria-label="学习辅助">
          <a id="review-link" class="btn btn--ghost btn--sm" href="#/review">复习</a>
          <a id="wrong-link" class="btn btn--ghost btn--sm" href="#/wrong">错题本</a>
          <a class="btn btn--ghost btn--sm" href="#/glossary">术语表</a>
          <a class="btn btn--ghost btn--sm" href="#/complexity">复杂度</a>
          <a class="btn btn--ghost btn--sm" href="#/pseudocode">伪代码</a>
          <a class="btn btn--ghost btn--sm" href="#/algorithms">算法</a>
        </nav>
        <button id="theme-toggle" class="btn btn--ghost btn--sm" type="button" aria-label="切换主题">
          主题：自动
        </button>
      </header>

      <main class="app-main" id="main">
        <!-- 由脚本渲染：学习地图（书的目录）或 关卡视图 -->
      </main>

      <footer class="app-footer">
        基于《Introduction to Algorithms》（CLRS 第 4 版）的闯关式交互学习站。进度只保存在本机浏览器。
      </footer>
    </div>

    <script type="module">
      import { h, $ } from "./assets/core/dom.js";
      import * as store from "./assets/core/store.js";
      import * as router from "./assets/core/router.js";
      import * as katex from "./assets/core/katex.js";
      import { getChapter } from "./assets/chapters.js";
      import { renderChapter } from "./assets/ui/chapter-view.js";
      import { renderWrong } from "./assets/ui/wrong-view.js";
      import { renderGlossary } from "./assets/ui/glossary-view.js";
      import { renderComplexity } from "./assets/ui/complexity-view.js";
      import { renderReview } from "./assets/ui/review-view.js";
      import { renderBoss } from "./assets/ui/boss-view.js";
      import { renderPseudocode } from "./assets/ui/pseudocode-view.js";
      import { renderAlgorithms } from "./assets/ui/algorithms-view.js";
      import { STRUCTURE, APPENDICES, TOTAL_LEVELS, TOTAL_CHAPTERS, allChapters } from "./assets/data/structure.js";

      /* ----------------------------------------------------------------------
       * 九段式关卡：每关固定 9 个阶段（见 docs/开发规范.md 4.2）。
       * 进度层的分母就是它。
       * -------------------------------------------------------------------- */
      const STAGE_COUNT = 9;

      /* ======================================================================
       * 进度层：全部读自本机存档（store），没有记录就是 0。
       * 只统计「已经建好关卡文件」的章 —— 没建的章不假装有进度。
       * ==================================================================== */
      function builtLevels(n) {
        const mod = getChapter(n);
        return mod && Array.isArray(mod.levels) ? mod.levels : [];
      }

      function levelStages(n, key) {
        return store.getStageSet(n, key).size;
      }

      /** 一章的进度：已完成关数 / 已开始未完成关数 / 已过阶段数 */
      function chapterProgress(ch) {
        const built = builtLevels(ch.n);
        let done = 0, started = 0, stages = 0;
        built.forEach((lv) => {
          const s = levelStages(ch.n, lv.key);
          stages += s;
          if (store.chapterDone(ch.n, lv.key)) done += 1;
          else if (s > 0) started += 1;
        });
        return { built: built.length, done, started, stages, capacity: built.length * STAGE_COUNT };
      }

      function globalProgress() {
        let done = 0, stages = 0, capacity = 0;
        allChapters().forEach((ch) => {
          const pr = chapterProgress(ch);
          done += pr.done;
          stages += pr.stages;
          capacity += pr.capacity;
        });
        return { done, stages, capacity };
      }

      /** 下一步该学哪一关：第一个「已建但没做完」的关卡 */
      function nextUp() {
        for (const ch of allChapters()) {
          for (const lv of builtLevels(ch.n)) {
            if (!store.chapterDone(ch.n, lv.key)) {
              return { ch, lv, stages: levelStages(ch.n, lv.key) };
            }
          }
        }
        return null;
      }

      /** 每关一格的进度刻度（无背景轨道，不是进度条） */
      function ticks(ch) {
        const built = builtLevels(ch.n);
        const cells = [];
        for (let i = 0; i < ch.count; i++) {
          const lv = built[i];
          let mark = null;
          if (lv) {
            if (store.chapterDone(ch.n, lv.key)) mark = { dataset: { on: "1" } };
            else if (levelStages(ch.n, lv.key) > 0) mark = { dataset: { part: "1" } };
          }
          cells.push(h("i", mark));
        }
        return h("span", { class: "ticks", "aria-hidden": "true" }, cells);
      }

      /** 给读屏用的进度说明 */
      function progressText(ch, pr) {
        if (!pr.built) return "尚未建好关卡";
        if (pr.done === pr.built) return `已建 ${pr.built} 关，全部完成`;
        if (pr.done || pr.started) return `已建 ${pr.built} 关，完成 ${pr.done} 关，进行中 ${pr.started} 关`;
        return `已建 ${pr.built} 关，尚未开始`;
      }

      /* ---------------- 主题切换 ---------------- */
      const THEME_ORDER = ["auto", "light", "dark"];
      const THEME_LABEL = { auto: "自动", light: "明色", dark: "暗色" };
      const toggleBtn = $("#theme-toggle");

      function refreshThemeLabel() {
        const t = store.getThemePref();
        toggleBtn.textContent = "主题：" + (THEME_LABEL[t] || t);
      }
      toggleBtn.addEventListener("click", () => {
        const cur = store.getThemePref();
        const next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
        store.setThemePref(next); // 内部已 applyTheme()
        refreshThemeLabel();
      });
      store.applyTheme();
      refreshThemeLabel();

      /* ---------------- 顶栏的错题本入口 ---------------- */
      function refreshWrongLink() {
        const el = $("#wrong-link");
        if (!el) return;
        const n = store.getWrong().length;
        el.textContent = n ? "错题本 " + n : "错题本";
        el.setAttribute("aria-label", n ? "错题本，" + n + " 道待回炉" : "错题本，当前为空");
      }

      /* ---------------- 顶栏的复习入口（显示到期题数） ---------------- */
      function refreshReviewLink() {
        const el = $("#review-link");
        if (!el) return;
        const n = store.dueReviews().length;
        el.textContent = n ? "复习 " + n : "复习";
        el.setAttribute("aria-label", n ? "复习，" + n + " 道题到期" : "复习，当前没有到期的题");
      }

      /* ---------------- 顶栏的全局进度 ---------------- */
      function refreshHeaderProgress() {
        const g = globalProgress();
        const el = $("#header-progress");
        if (!el) return;
        if (!g.capacity) {
          el.textContent = "";
          return;
        }
        el.textContent = `已完成 ${g.done} 关 / 已建 ${g.capacity / STAGE_COUNT} 关`;
      }

      /* ---------------- 渲染：报头 ---------------- */
      function renderMasthead() {
        const g = globalProgress();
        return h("header", { class: "masthead" },
          h("div", null,
            h("div", { class: "masthead__eyebrow" },
              "Introduction to Algorithms · Fourth Edition"),
            h("h1", { class: "masthead__title" },
              "《算法导论》", h("em", null, "闯关式学习站")),
            h("p", { class: "masthead__lede" },
              "写给有 C 基础、没有算法基础的同学。全书按 ",
              String(TOTAL_LEVELS),
              " 个关卡组织，每关九个阶段递进：从直觉到原文，再到伪代码、动画、C 实现与正确性证明。像 ",
              katex.renderInline("\\Theta(n\\lg n)"),
              " 这样的结论，都能自己推一遍。")
          ),
          h("div", { class: "masthead__stats" },
            h("div", { class: "stat" },
              h("div", { class: "stat__num" }, String(TOTAL_LEVELS)),
              h("div", { class: "stat__label" }, "关卡")),
            h("div", { class: "stat" },
              h("div", { class: "stat__num" }, String(TOTAL_CHAPTERS)),
              h("div", { class: "stat__label" }, "章 · 含附录")),
            h("div", { class: "stat" },
              h("div", { class: "stat__num" }, String(g.done)),
              h("div", { class: "stat__label" }, "已完成"))
          )
        );
      }

      /* ---------------- 渲染：续读条 ---------------- */
      function renderResume() {
        const nx = nextUp();
        if (!nx) {
          const built = allChapters().filter((ch) => builtLevels(ch.n).length);
          return h("section", { class: "resume" },
            h("span", { class: "resume__no" }, "✓"),
            h("div", null,
              h("h2", { class: "resume__title" }, "已建好的关卡都做完了"),
              h("p", { class: "resume__meta" },
                "继续学习需要新章节的关卡文件。目前已完成 ",
                String(built.length), " 章的关卡；下一章可以按 ",
                h("span", { class: "mono" }, "docs/关卡编写手册.md"),
                " 里的三步流程开工。")),
            null
          );
        }
        const ch = nx.ch;
        const label = typeof ch.n === "number" ? `第 ${ch.n} 章` : `附录 ${ch.n}`;
        return h("section", { class: "resume" },
          h("span", { class: "resume__no" }, nx.lv.section),
          h("div", null,
            h("h2", { class: "resume__title" },
              nx.lv.title || nx.lv.shortTitle || ch.zh),
            h("p", { class: "resume__meta" },
              label, " ", ch.zh, " · 已过 ", String(nx.stages), " / ", String(STAGE_COUNT), " 个阶段")),
          h("a", { class: "btn btn--primary", href: router.buildUrl(ch.n, nx.lv.key) },
            nx.stages === 0 ? "从这里开始" : "继续这一关")
        );
      }

      /* ---------------- 渲染：目录里的一个章条目 ---------------- */
      function renderChapterRow(ch, currentN) {
        const pr = chapterProgress(ch);
        const built = pr.built > 0;
        const isCurrent = built && String(ch.n) === String(currentN);
        const no = typeof ch.n === "number" ? `第 ${ch.n} 章` : `附录 ${ch.n}`;
        const meta = h("span", { class: "toc__meta" },
          h("span", null, `${ch.count} 关`),
          built ? ticks(ch) : h("span", { class: "pending-tag" }, "待建")
        );
        const title = h("span", { class: "toc__title" },
          ch.zh,
          h("span", { class: "toc__title-en" }, ch.title)
        );
        if (!built) {
          return h("div", {
            class: "toc__row toc__row--pending",
            title: "这一章的关卡文件还没写",
          },
            h("span", { class: "toc__no" }, no), title, meta);
        }
        return h("a", {
          class: "toc__row" + (isCurrent ? " toc__row--current" : ""),
          href: router.buildUrl(ch.n, "s01"),
          "aria-current": isCurrent ? "true" : null,
          "aria-label": `${no} ${ch.zh}，${progressText(ch, pr)}`,
        },
          h("span", { class: "toc__no" }, no), title, meta);
      }

      /* ---------------- 渲染：正文的 Part 目录 ---------------- */
      function renderToc() {
        const nx = nextUp();
        const currentN = nx ? nx.ch.n : null;
        return h("nav", { class: "toc", "aria-label": "全书目录" },
          ...STRUCTURE.map((part) => {
            const levels = part.chapters.reduce((a, c) => a + c.count, 0);
            const builtCount = part.chapters.filter((ch) => builtLevels(ch.n).length).length;
            const doneCount = part.chapters.reduce((a, ch) => a + chapterProgress(ch).done, 0);
            return h("section", { class: "toc__part" },
              h("div", { class: "toc__part-head" },
                h("span", { class: "toc__part-no" }, part.no),
                h("h2", { class: "toc__part-name" },
                  part.title,
                  h("span", { class: "toc__part-zh" },
                    part.zh, " · ", String(part.chapters.length), " 章 ",
                    String(levels), " 关")
                ),
                h("span", { class: "toc__part-meta" },
                  builtCount
                    ? `已建 ${builtCount} 章，完成 ${doneCount} 关`
                    : "关卡待建")
              ),
              h("div", { class: "toc__list" },
                part.chapters.map((ch) => renderChapterRow(ch, currentN)))
            );
          })
        );
      }

      /* ---------------- 渲染：附录（换一种版式） ---------------- */
      function renderAppendix() {
        return h("section", { class: "appendix" },
          h("h2", { class: "toc__part-name" }, "附录 · Appendix: Mathematical Background",
            h("span", { class: "toc__part-zh" }, "数学基础 · 4 篇，需要时随手查")),
          h("div", { class: "appendix__list" },
            ...APPENDICES.map((ch) => {
              const pr = chapterProgress(ch);
              const built = pr.built > 0;
              const body = [
                h("span", { class: "appendix__letter" }, ch.n),
                h("span", { class: "appendix__name" }, ch.zh,
                  h("span", { class: "toc__title-en" }, ch.title)),
                h("span", { class: "appendix__meta" },
                  built ? `${ch.count} 关` : "待建"),
              ];
              return built
                ? h("a", {
                    class: "appendix__item",
                    href: router.buildUrl(ch.n, "s01"),
                    "aria-label": `附录 ${ch.n} ${ch.zh}，${progressText(ch, pr)}`,
                  }, ...body)
                : h("div", { class: "appendix__item appendix__item--pending" }, ...body);
            })
          )
        );
      }

      /* ---------------- 渲染：学习地图 ---------------- */
      function renderMap() {
        return h("div", null,
          renderMasthead(),
          renderResume(),
          renderToc(),
          renderAppendix()
        );
      }

      /* ---------------- 渲染：章节尚未建设时的占位 ---------------- */
      function renderPending(route) {
        const label = route.isAppendix
          ? `附录 ${String(route.ch).toUpperCase()}`
          : `第 ${route.chNum} 章`;
        const found = allChapters().find(
          (c) => String(c.n).toUpperCase() === String(route.isAppendix ? route.ch : route.chNum).toUpperCase()
        );
        return h("div", { class: "pending" },
          h("div", { class: "pending__eyebrow" }, "Not yet written"),
          h("h1", { class: "pending__title" }, label, found ? ` ${found.zh}` : ""),
          found ? h("p", { class: "pending__en" }, found.title) : null,
          h("p", { class: "pending__note" },
            "该章的关卡文件还没写。请回到学习地图，查看当前已建章节与关卡。"),
          h("p", { class: "pending__route" }, "当前路由：", route.raw || "#/"),
          h("div", { class: "pending__actions" },
            h("a", { class: "btn btn--primary", href: "#/ch02/s01/s01" },
              "去看已完成的关卡：2.1 插入排序"),
            h("a", { class: "btn btn--ghost", href: "#/" }, "回到目录")
          )
        );
      }

      /* ---------------- 路由驱动渲染 ---------------- */
      const main = $("#main");
      let currentView = null; // 持有上一个视图，用于清理定时器与监听

      function renderHome() {
        main.appendChild(renderMap());
        refreshHeaderProgress();
      }

      function teardownView() {
        if (currentView && currentView.destroy) {
          try { currentView.destroy(); } catch (e) { console.error(e); }
        }
        currentView = null;
      }

      /**
       * 渲染一条路由。
       * ★ 必须是具名函数：错题本里「移除一条」之后页面当场就短了，得就地重画，
       *   不能等 hash 变化（hash 没变，onChange 不会再触发）。
       */
      function renderRoute(route) {
        teardownView();
        main.replaceChildren();

        if (route.kind === "wrong") {
          currentView = renderWrong({ onMutate: () => renderRoute(route) });
          main.appendChild(currentView.node);
        } else if (route.kind === "glossary") {
          currentView = renderGlossary();
          main.appendChild(currentView.node);
        } else if (route.kind === "complexity") {
          currentView = renderComplexity();
          main.appendChild(currentView.node);
        } else if (route.kind === "pseudocode") {
          currentView = renderPseudocode();
          main.appendChild(currentView.node);
        } else if (route.kind === "review") {
          currentView = renderReview();
          main.appendChild(currentView.node);
        } else if (route.kind === "algorithms") {
          currentView = renderAlgorithms();
          main.appendChild(currentView.node);
        } else if (route.kind === "chapter" || route.kind === "appendix") {
          const chapter = getChapter(route.ch);
          if (chapter && route.section === 'boss') {
            // 章末 Boss 区（#/ch03/boss）：section 解析出来是 boss，不是关卡，
            // 必须在 renderChapter 之前拦下，否则会显示「这个关卡还没有内容」。
            currentView = renderBoss(chapter);
            main.appendChild(currentView.node);
          } else if (chapter) {
            currentView = renderChapter(chapter, route);
            main.appendChild(currentView.node);
          } else {
            main.appendChild(renderPending(route));
          }
        } else if (route.kind === "home") {
          main.appendChild(renderMap());
        } else {
          main.appendChild(router.view404());
        }

        refreshHeaderProgress();
        refreshWrongLink();
        refreshReviewLink();
        window.scrollTo(0, 0);
      }

      router.onChange(renderRoute);
      router.start();

      /* 进度变化（做完某一段、测验得分）时刷新顶栏与目录上的读数 */
      store.subscribe(() => {
        if (router.parse().kind === "home") {
          main.replaceChildren();
          renderHome();
        } else {
          refreshHeaderProgress();
        }
        refreshWrongLink();
        refreshReviewLink();
      });
    </script>
  </body>
</html>
