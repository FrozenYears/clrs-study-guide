<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smoke-array · 数组引擎单步演示</title>
<!-- 设计令牌回退值：生产中由 site/assets/theme.css 提供，这里仅让 smoke 页可独立预览。
     引擎本身只引用 var(--viz-*) 名字，不定义任何颜色。 -->
<style>
  :root{
    --bg-0:#ffffff; --bg-1:#f1f3f5; --bg-2:#e9ecef;
    --fg-0:#212529; --fg-1:#495057; --fg-2:#868e96;
    --bd-0:#adb5bd; --bd-1:#dee2e6;
    --viz-idle:#ced4da; --viz-compare:#f08c00; --viz-active:#7048e8;
    --viz-done:#1c7ed6; --viz-result:#0ca678; --viz-mark:#495057; --viz-violation:#e03131;
    --font-sans:system-ui,"Microsoft YaHei",sans-serif;
    --font-mono:"Cascadia Code",Consolas,monospace;
  }
  body{font-family:var(--font-sans);color:var(--fg-0);background:var(--bg-0);margin:0;padding:16px;}
  h1{font-size:16px;margin:0 0 8px}
  #stage{background:var(--bg-1);border:1px solid var(--bd-1);border-radius:8px;padding:8px;max-width:760px;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;max-width:760px;}
  button{font:14px var(--font-sans);padding:6px 12px;border:1px solid var(--bd-0);background:var(--bg-0);color:var(--fg-0);border-radius:6px;cursor:pointer;}
  button:disabled{opacity:.4;cursor:default;}
  .meta{font:13px var(--font-mono);color:var(--fg-1);margin-top:8px;}
  input{font:14px var(--font-mono);padding:5px 8px;border:1px solid var(--bd-0);border-radius:6px;width:240px;}
  .hint{font-size:12px;color:var(--fg-2);margin-top:6px}
  @media (prefers-reduced-motion: reduce){ * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <h1>smoke-array：数组可视化引擎 + 插入排序生成器（手写 stepper）</h1>
  <div id="stage" aria-live="polite"></div>

  <div class="bar">
    <button id="prev" title="上一步 (←)">◀ 上一步</button>
    <button id="next" title="下一步 (→)">下一步 ▶</button>
    <button id="play" title="播放/暂停 (空格)">▶ 播放</button>
    <button id="reset" title="重置">⟲ 重置</button>
    <button id="mode" title="切换 柱状/扑克牌">模式：柱状</button>
    <input id="arr" value="5,2,4,6,1,3" aria-label="输入数组，逗号分隔">
    <button id="load">载入</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="hint">键盘：←/→ 单步，空格 播放/暂停，R 重置。独立预览请通过 http 服务打开（ES Module 需同源）。</div>

<script type="module">
import { create as createArray } from '../assets/viz/array.js';
import { insertionSort } from '../assets/algorithms/insertion-sort.js';

const stage = document.getElementById('stage');
const meta = document.getElementById('meta');
let frames = [], i = 0, playing = null, mode = 'bars', engine = null;

// —— 手写极简 stepper（约 30 行）——
function build(input){
  frames = [...insertionSort(input)];        // 预展开所有帧，便于前进/回退
  i = 0;
  if (engine) engine.destroy();
  engine = createArray(stage, { mode });
  render();
}
function render(){
  engine.render(frames[i]);
  const f = frames[i];
  meta.textContent =
    `帧 ${i+1}/${frames.length} · 伪代码第 ${f.line ?? '—'} 行 · ` +
    `cmp=${f.counts.cmp} move=${f.counts.move}` + (f.done ? ' · 完成 ✓' : '');
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === frames.length - 1;
}
function step(d){ i = Math.max(0, Math.min(frames.length - 1, i + d)); render(); }
function play(){ if (playing) { clearInterval(playing); playing = null; document.getElementById('play').textContent = '▶ 播放'; }
  else { playing = setInterval(() => { if (i >= frames.length - 1) { clearInterval(playing); playing = null; document.getElementById('play').textContent = '▶ 播放'; } else step(1); }, 600); document.getElementById('play').textContent = '⏸ 暂停'; } }

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('play').onclick = play;
document.getElementById('reset').onclick = () => build(parseInput());
document.getElementById('load').onclick = () => build(parseInput());
document.getElementById('mode').onclick = (e) => { mode = mode === 'bars' ? 'cards' : 'bars'; e.target.textContent = '模式：' + (mode === 'bars' ? '柱状' : '扑克牌'); build(parseInput()); };
function parseInput(){ return document.getElementById('arr').value.split(',').map(s => parseInt(s.trim(),10)).filter(n => !Number.isNaN(n)); }
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === ' ') { e.preventDefault(); play(); }
  else if (e.key === 'r' || e.key === 'R') build(parseInput());
});

build([5,2,4,6,1,3]);   // 原书 Figure 2.2
</script>
</body>
</html>
