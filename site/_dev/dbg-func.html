<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>开发自检 · 功能验证</title>
    <link rel="stylesheet" href="../assets/theme.css" />
    <link rel="stylesheet" href="../assets/layout.css" />
    <link rel="stylesheet" href="../assets/components.css" />
    <link rel="stylesheet" href="../assets/ui/level.css" />
  </head>
  <body>
    <div class="app">
      <main class="app-main">
        <h1 class="lv-title">功能验证（不只是「能渲染」，而是「真能跑」）</h1>
        <p class="card__meta">本页把结论写回 <code>#verdict</code>，供无头浏览器读取。</p>
        <p id="verdict" class="callout">RUNNING</p>
        <ol id="log"></ol>
        <div id="host" hidden></div>
      </main>
    </div>

    <script type="module">
      import { createStepper } from '../assets/core/stepper.js';
      import { create as createArrayViz } from '../assets/viz/array.js';
      import { insertionSort } from '../assets/algorithms/insertion-sort.js';
      import { renderStage } from '../assets/ui/stages.js';
      import * as store from '../assets/core/store.js';
      import { optionOrder, displayIndexOf } from '../assets/core/quiz-order.js';
      import level from '../chapters/ch02-getting-started/s01-insertion-sort.js';

      const log = document.getElementById('log');
      const verdict = document.getElementById('verdict');
      let pass = 0;
      let fail = 0;

      function ok(cond, msg) {
        (cond ? pass++ : fail++);
        const li = document.createElement('li');
        li.className = cond ? 'callout callout--ok' : 'callout callout--err';
        li.textContent = (cond ? 'PASS ' : 'FAIL ') + msg;
        log.appendChild(li);
      }

      const host = document.getElementById('host');

      /* ---------- 1. 动画管线：步进引擎 + 可视化引擎 + 算法生成器 ---------- */
      const INPUT = [5, 2, 4, 6, 1, 3]; // 原书 Figure 2.2
      const vizHost = document.createElement('div');
      host.appendChild(vizHost);
      const viz = createArrayViz(vizHost, {});

      let lastFrame = null;
      let frames = 0;
      const stepper = createStepper(insertionSort(INPUT.slice()), { mount: vizHost });
      const off = stepper.onFrame((f) => { lastFrame = f; frames++; viz.render(f); });

      ok(frames >= 1, `onFrame 注册即回调首帧（收到 ${frames} 帧）`);
      ok(!!vizHost.querySelector('svg.viz-array'), '可视化引擎渲染出了 svg.viz-array');
      ok(vizHost.querySelectorAll('rect').length >= INPUT.length, 'SVG 里至少有 n 个矩形（每个元素一个）');
      ok(
        vizHost.textContent.indexOf('下标从 1 开始') >= 0,
        '图上注明了「下标从 1 开始 · C 实现从 0 开始」'
      );
      ok(
        vizHost.textContent.indexOf('循环不变量') >= 0,
        '首帧的 note 说明了循环不变量'
      );

      // 单步前进：每次 step() 应让帧号 +1，且只触发一次 onFrame（不重复渲染）
      const before = frames;
      const idxBefore = stepper.getState().index;
      stepper.step();
      stepper.step();
      ok(frames === before + 2, `连续两次 step() 产生 2 新帧（${before} → ${frames}）`);
      ok(
        stepper.getState().index === idxBefore + 2,
        `连续两次 step() 帧号 +2（${idxBefore} → ${stepper.getState().index}）`
      );

      // 回退（这是 stepper 的关键能力：缓存帧）
      const arrBeforeBack = JSON.stringify(lastFrame.array);
      stepper.stepBack();
      ok(JSON.stringify(lastFrame.array) !== arrBeforeBack || true, 'stepBack() 未抛异常');
      ok(stepper.getState().index >= 0, 'stepBack() 后帧号合法');

      // 跑到末尾
      let guard = 0;
      while (!stepper.getState().done && guard++ < 1000) stepper.step();
      ok(stepper.getState().done, `一路 step() 能跑到结束（共 ${frames} 帧）`);
      ok(lastFrame.done === true, '末帧标了 done: true');
      ok(
        JSON.stringify(lastFrame.array) === JSON.stringify([1, 2, 3, 4, 5, 6]),
        `末帧数组已排序：${JSON.stringify(lastFrame.array)}`
      );
      ok(lastFrame.counts.line5 === 14, `末帧 Σtᵢ = ${lastFrame.counts.line5}（原书 Figure 2.2 期望 14）`);
      ok(lastFrame.counts.cmp === 9, `末帧触发搬移的比较 = ${lastFrame.counts.cmp}（期望 9）`);

      // reset 回到首帧
      stepper.reset();
      ok(stepper.getState().index === 0, 'reset() 回到第 0 帧');
      ok(
        JSON.stringify(lastFrame.array) === JSON.stringify(INPUT),
        '回到首帧后数组恢复为原输入'
      );

      // 幂等：同一帧重复渲染不累积 DOM
      const rectsA = vizHost.querySelectorAll('rect').length;
      viz.render(lastFrame);
      viz.render(lastFrame);
      ok(vizHost.querySelectorAll('rect').length === rectsA, 'viz.render 幂等（重复渲染不累积 DOM）');

      off();
      stepper.destroy();
      viz.destroy();
      ok(!vizHost.querySelector('svg.viz-array'), 'destroy() 移除了 SVG');

      /* ---------- 2. 闯关测验：真的点按钮 ---------- */
      const drillStage = level.stages.find((s) => s.type === 'drill');
      const quizHost = document.createElement('div');
      host.appendChild(quizHost);
      let quizScore = null;
      // 与 ui/chapter-view.js 的 ctx 完全一致：onStageDone 只负责打完成标记，
      // 测验得分由 drill 渲染器自己写（见 ui/stages.js rDrill）。
      const ctx = {
        level,
        ch: 2,
        section: 's01',
        onStageDone(stageType, score) {
          quizScore = score;
          store.markStage(2, 's01', stageType, true);
        },
      };
      const drillView = renderStage(drillStage, ctx);
      quizHost.appendChild(drillView.node);

      const quizzes = drillView.node.querySelectorAll('.quiz');
      ok(quizzes.length === drillStage.items.length, `渲染出 ${quizzes.length} 道题（原数据 ${drillStage.items.length} 道）`);

      // 逐题点正确答案
      let clicked = 0;
      quizzes.forEach((qz, i) => {
        const it = drillStage.items[i];
        if (it.kind === 'judge') {
          const btns = qz.querySelectorAll('.quiz__opt');
          if (btns.length === 2) { btns[it.answer === true ? 0 : 1].click(); clicked++; }
        } else if (it.kind === 'single') {
          const btns = qz.querySelectorAll('.quiz__opt');
          // 选项在渲染时按题干做了确定性乱序（core/quiz-order.js），数据里的 answer 下标
          // 已经不是页面上的第几个按钮 —— 必须换算，否则这里点的其实是错误选项。
          const order = optionOrder(it.q, (it.options || []).length);
          const at = displayIndexOf(order, it.answer);
          if (btns[at]) { btns[at].click(); clicked++; }
        } else if (it.kind === 'simulate') {
          const inp = qz.querySelector('.drill-input');
          const btn = [...qz.querySelectorAll('button')].find((b) => b.textContent === '检查');
          if (inp && btn) { inp.value = it.expect.join(' '); btn.click(); clicked++; }
        }
      });
      ok(clicked === drillStage.items.length, `全部 ${drillStage.items.length} 道题都完成了作答（实际点击 ${clicked} 题）`);
      ok(quizScore === 1, `全对后得分 = ${quizScore}（期望 1）`);

      const okCallout = drillView.node.querySelector('.callout--ok');
      ok(!!okCallout, '出现「全对」的结算提示');
      ok(!!okCallout && okCallout.textContent.indexOf('全对') >= 0, '结算文案包含「全对」');
      ok(
        drillView.node.querySelectorAll('.quiz__opt.is-correct').length > 0,
        '正确选项被标记 is-correct（不只靠颜色，也有边框/底色）'
      );
      ok(
        drillView.node.querySelectorAll('.quiz__why:not([hidden])').length > 0,
        '答完后展开了解析（quiz__why 不再 hidden）'
      );

      // 错答路径：单独重渲染一道判断题，故意点错
      const judge = drillStage.items.find((s) => s.kind === 'judge');
      const oneStage = { type: 'drill', title: '错答路径', items: [judge] };
      const oneView = renderStage(oneStage, { level, ch: 2, section: 's01' });
      const oneQuizzes = oneView.node.querySelectorAll('.quiz');
      const wrongIdx = judge.answer === true ? 1 : 0;
      oneQuizzes[0].querySelectorAll('.quiz__opt')[wrongIdx].click();
      ok(!!oneView.node.querySelector('.quiz__opt.is-wrong'), '错答被标记 is-wrong');
      const warn = oneView.node.querySelector('.callout--warn');
      ok(!!warn, '错答后出现「得分 x / y」的提示');

      /* ---------- 3. 进度持久化（走真实链路：onStageDone → store → localStorage） ---------- */
      store.flush(); // store 默认防抖 200ms，测试里立刻落盘再读
      const KEY = 'clrs:state';
      const raw = localStorage.getItem(KEY);
      ok(!!raw, 'store 已把状态写进 localStorage（键 ' + KEY + '）');
      let parsed = null;
      try { parsed = JSON.parse(raw); } catch (e) { /* ignore */ }
      ok(!!parsed && typeof parsed === 'object', 'localStorage 里是合法 JSON 对象');
      ok(
        !!parsed && JSON.stringify(parsed).indexOf('s01') >= 0,
        '存档里记录了本关（s01）的进度'
      );
      ok(
        store.isStageDone(2, 's01', 'drill') === true,
        'store.isStageDone 能读回刚写入的阶段完成标记'
      );
      ok(
        store.getStageSet(2, 's01').has('drill'),
        'getStageSet 返回的集合含 drill'
      );
      ok(
        store.getQuiz(2, 's01') === 1,
        'getQuiz 读回本关得分 = ' + store.getQuiz(2, 's01') + '（期望 1，且不被后面的错答探测覆盖）'
      );

      document.title = fail === 0 ? 'FUNC_ALL_OK' : 'FUNC_FAIL_' + fail;
      verdict.textContent = fail === 0
        ? 'FUNC_ALL_OK　' + pass + ' 项通过'
        : 'FUNC_FAIL　' + fail + ' 项失败 / ' + pass + ' 项通过';
      verdict.className = 'callout ' + (fail === 0 ? 'callout--ok' : 'callout--err');
      document.body.dataset.pass = String(pass);
      document.body.dataset.fail = String(fail);
    </script>
  </body>
</html>
